name: Cloud validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Production read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production preflight
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: npm run test:cloud:preflight
