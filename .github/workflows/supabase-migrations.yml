name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/integration/supabaseRls.integration.test.js'
      - '.github/workflows/supabase-migrations.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/integration/supabaseRls.integration.test.js'
      - '.github/workflows/supabase-migrations.yml'

concurrency:
  group: supabase-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase@latest start
      - name: Reset local database
        run: npx supabase@latest db reset --local
      - name: Lint local migrations
        run: npx supabase@latest db lint --local
      - name: Run local RLS allow/deny matrix
        run: |
          eval "$(npx supabase@latest status -o env)"
          RUN_SUPABASE_RLS_TESTS=true \
            SUPABASE_TEST_URL="$API_URL" \
            SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY" \
            SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npm run test:integration:supabase-rls
      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop
