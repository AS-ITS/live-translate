name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-migrations.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-migrations.yml'

concurrency:
  group: supabase-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase@latest start
      - name: Reset local database
        run: npx supabase@latest db reset --local
      - name: Lint local migrations
        run: npx supabase@latest db lint --local
      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop
