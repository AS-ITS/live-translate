name: Vercel Preview check

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preflight:
    name: Vercel Preview preflight
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview' &&
      github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deployment preflight
        env:
          SMOKE_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:deployment-preflight
